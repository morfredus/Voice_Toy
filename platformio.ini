; ESP32-Foundation — PlatformIO Project Configuration File
;
; Framework générique ESP32 (core + services), réutilisable pour tout projet.
; Le code métier vit dans src/modules/ — il ne doit jamais être ajouté ici.

[platformio]
description  = Voice Toy - Transforme la voix avec differents effets
default_envs = esp32s3_n16r8

[env:esp32s3_n16r8]
platform      = espressif32
board         = esp32-s3-devkitc-1-n16r8v
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

board_build.usb_mode        = "cdc"
board_build.usb_cdc_on_boot = 1
board_build.filesystem      = littlefs

; Génère project_config.h (BUILD_DATE/BUILD_TIME/GIT_COMMIT/PROJECT_VERSION)
; avant chaque compilation. La minification des assets web (web_src/ -> data/)
; est volontairement manuelle : voir tools/minify_web.py et
; docs/INTEGRATION_GUIDE.md.
extra_scripts =
    pre:tools/build_info.py

build_unflags =
    -std=gnu++11
    -std=gnu++14

build_flags =
    -std=gnu++17
    -D PROJECT_NAME='"Voice Toy"'

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
